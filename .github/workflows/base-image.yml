name: base-image

# Builds and publishes the forge-ai-base image (heavy, rarely-changing runtime
# layers). Runs only when the base definition or agent config changes, or on
# manual dispatch. Release builds (release.yml) consume this image, so they no
# longer rebuild apt/npm/playwright/nix on every tag.

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile.base"
      - "scripts/agent-config/**"
      - ".github/workflows/base-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/forge-ai-base:latest
            ghcr.io/${{ github.repository_owner }}/forge-ai-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
